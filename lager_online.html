<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pakora Lager Live (Cloud)</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* --- DESIGN SYSTEM (IDENTISCH ZUR HAUPT-APP) --- */
        :root { 
            --primary: #2563eb; 
            --primary-dark: #1e40af; 
            --secondary: #64748b; 
            --accent: #f59e0b; 
            --bg: #f8fafc; 
            --surface: #ffffff; 
            --text: #0f172a; 
            --border: #e2e8f0; 
            --radius: 16px; 
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; 
        }

        /* SIDEBAR */
        .sidebar { 
            width: 280px; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            padding: 25px 20px; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; 
            flex-shrink: 0;
            height: 100%;
        }
        
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 30px; 
            margin-bottom: 60px; 
            color: #fff; 
        }
        .logo img { max-width: 100%; height: auto; max-height: 150px; object-fit: contain; }

        .nav-item { 
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #94a3b8; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            transition: 0.2s; 
            margin-bottom: 5px; 
            font-size: 15px;
            text-decoration: none;
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(37,99,235,0.4); }

        /* MAIN AREA */
        .main { 
            flex: 1; 
            padding: 30px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        /* DASHBOARD GRID */
        .header-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
        }
        .stat-val { font-size: 24px; font-weight: 800; color: var(--text); }
        .stat-label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* TABLE & CONTROLS */
        .card { 
            background: var(--surface); 
            padding: 25px; 
            border-radius: var(--radius); 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow); 
            flex: 1; /* FÃ¼llt den Rest */
            display: flex;
            flex-direction: column;
        }

        .controls { display: grid; grid-template-columns: 1fr auto auto auto; gap: 15px; margin-bottom: 20px; }
        .category-jump {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .jump-chip {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .jump-chip:hover { border-color: #2563eb; color: #2563eb; }
        
        input, select { 
            width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none;
        }
        input:focus, select:focus { border-color: var(--primary); }

        .btn { 
            padding: 14px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); }
        .btn-upload { background: var(--accent); }
        .btn-new { background: #16a34a; }
        
        .stock-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .stock-table th { text-align: left; padding: 12px; background: #f1f5f9; color: #475569; font-size: 12px; text-transform: uppercase; }
        .stock-table td { padding: 15px 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .stock-table tr:last-child td { border-bottom: none; }
        .category-row td {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #eef3f9;
            font-weight: 800;
            color: #142033;
        }
        .performance-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .performance-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }
        .performance-badge.nk {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .performance-badge.tk {
            background: #fee2e2;
            color: #b91c1c;
        }
        .action-col { text-align: right; }

        /* STOCK CONTROLLER */
        .stock-ctrl { display: flex; align-items: center; gap: 5px; }
        .btn-qty { width: 32px; height: 32px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary); }
        .btn-qty:active { background: #eff6ff; }
        .val-qty { font-weight: 700; width: 40px; text-align: center; }

        /* STATUS BADGE */
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .st-ok { background: #dcfce7; color: #166534; }
        .st-low { background: #fee2e2; color: #991b1b; }
        
        .online-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online-dot.active { background: #16a34a; box-shadow: 0 0 10px #16a34a; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 90%; max-width: 600px; border-radius: 12px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: 800; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--secondary); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }


        /* MOBILE */
        .mobile-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 2000; background: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 50%; font-size: 20px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 900; }

        @media (max-width: 900px) {
            .sidebar { position: fixed; transform: translateX(-100%); width: 85%; max-width: 320px; box-shadow: 10px 0 30px rgba(0,0,0,0.2); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block; }
            .mobile-overlay.active { display: block; }
            .main { padding: 80px 15px 20px 15px; }
            .controls { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="app-theme.css">
</head>
<body>

    <div class="mobile-overlay" onclick="toggleSidebar()"></div>
    <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Menue oeffnen">â˜°</button>

    <nav class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Pakora" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <span style="display:none; font-size: 22px; font-weight:700;">Pakora</span>
        </div>
        <a href="index.html" class="nav-item">Ãœbersicht</a>
        <a href="lager_online.html" class="nav-item active">Lagerbestand</a>
        <a href="index.html#calc" class="nav-item">Smart-Kalkulation</a>
        <a href="konfigurator.html" class="nav-item">KÃ¼hlzellen Kalkulator</a>
    </nav>

    <main class="main">
        
        <div class="header-card">
            <div>
                <h1 style="margin:0; font-size:22px; font-weight:800;">Zentrallager Live</h1>
                <div style="font-size:13px; color:var(--secondary); margin-top:5px;">
                    <span class="online-dot" id="onlineDot"></span> 
                    <span id="connectionText">Verbinde mit Cloud...</span>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-primary" id="oneDriveSyncBtn" type="button" onclick="syncFromOneDrive()">
                    OneDrive synchronisieren
                </button>
                <div id="lastSync" style="font-size:12px; color:#94a3b8; font-family:monospace;">
                    Sync: --:--:--
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="countTotal">0</div>
                <div class="stat-label">Positionen</div>
            </div>
            <div class="stat-card" style="border-left-color: #f59e0b;">
                <div class="stat-val" id="countLow">0</div>
                <div class="stat-label">Kritisch (Leer)</div>
            </div>
        </div>

        <div class="card">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Artikel, EAN oder Nummer suchen..." onkeyup="renderTable()">
                <button class="btn btn-upload" onclick="document.getElementById('csvInput').click()">
                    Liste abgleichen
                </button>
                <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="handleCSV(this)">
                <button class="btn btn-new" onclick="openModal()">
                    + Neuer Artikel
                </button>
            </div>

            <div class="category-jump" id="categoryJump">
                <button class="jump-chip" type="button" onclick="jumpToCategory('condensing_unit')">Verfluessigungssaetze</button>
                <button class="jump-chip" type="button" onclick="jumpToCategory('cp_box')">CP-Box</button>
                <button class="jump-chip" type="button" onclick="jumpToCategory('evaporator')">Verdampfer</button>
                <button class="jump-chip" type="button" onclick="jumpToCategory('compressor')">Kompressoren</button>
                <button class="jump-chip" type="button" onclick="jumpToCategory('accessory')">Zubehoer</button>
            </div>

            <div style="overflow-x:auto; flex:1;">
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>Art.Nr</th>
                            <th>Bezeichnung</th>
                            <th>Bestand</th>
                            <th>Status</th>
                            <th class="action-col">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" style="text-align:center; padding:30px; color:#94a3b8;">Lade Daten...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Neuer Artikel</div>
                <button class="close-btn" onclick="closeModal()">Ã—</button>
            </div>
            
            <input type="hidden" id="modalKey">
            
            <label>Art.Nr. / ID</label>
            <input type="text" id="modalId" placeholder="ID-123">

            <label>Bezeichnung</label>
            <input type="text" id="modalName" placeholder="Produktname">
            
            <div class="grid-2">
                <div>
                    <label>Preis (â‚¬)</label>
                    <input type="number" step="0.01" id="modalPrice" placeholder="0.00">
                </div>
                <div>
                    <label>Bestand</label>
                    <input type="number" id="modalQty" placeholder="0">
                </div>
            </div>

            <label>Kategorie</label>
            <select id="modalCat">
                <option value="compressor">Kompressor</option>
                <option value="condensing_unit">VerflÃ¼ssigungssatz</option>
                <option value="cp_box">CP-Box (GehÃ¤use)</option>
                <option value="evaporator">Verdampfer</option>
                <option value="accessory">ZubehÃ¶r</option>
            </select>

            <div class="grid-2">
                <div>
                    <label>Leistung NK (Watt)</label>
                    <input type="number" id="modalNK" placeholder="0">
                </div>
                <div>
                    <label>Leistung TK (Watt)</label>
                    <input type="number" id="modalTK" placeholder="0">
                </div>
            </div>

            <button class="btn btn-primary" onclick="saveProduct()" style="width:100%; margin-top:20px;">Speichern</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. INVENTORY API CONFIGURATION
        // ==========================================
        const SYNC_FUNCTION_URL = "https://us-central1-pakora-automations-chat.cloudfunctions.net/syncOneDriveExcel";
        const INVENTORY_API_URL = "https://us-central1-pakora-automations-chat.cloudfunctions.net/inventoryApi";
        // ==========================================

        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.querySelector('.mobile-overlay').classList.toggle('active');
        }

        let localData = {};

        function setConnectionState(text, isOnline) {
            const dot = document.getElementById('onlineDot');
            const txt = document.getElementById('connectionText');
            dot.classList.toggle('active', !!isOnline);
            txt.innerText = text;
            txt.style.color = isOnline ? '#166534' : '#dc2626';
        }

        function setSyncButtonState(isLoading, label = 'OneDrive synchronisieren') {
            const button = document.getElementById('oneDriveSyncBtn');
            if (!button) return;
            button.disabled = !!isLoading;
            button.textContent = label;
        }

        function categoryLabel(category) {
            const labels = {
                condensing_unit: 'Verfluessigungssaetze',
                cp_box: 'CP-Box',
                evaporator: 'Verdampfer',
                compressor: 'Kompressoren',
                accessory: 'Zubehoer'
            };
            return labels[category] || category || 'Sonstiges';
        }

        function formatCapacity(value) {
            const num = Number(value || 0);
            if (!num) return '';
            return `${num.toLocaleString('de-DE')} W`;
        }

        function renderPerformanceBadges(item, category) {
            if (category !== 'condensing_unit') return '';
            const badges = [];
            if (Number(item.capacityNK || 0) > 0) {
                badges.push(`<span class="performance-badge nk">Normalkuehlung -10: ${formatCapacity(item.capacityNK)}</span>`);
            }
            if (Number(item.capacityTK || 0) > 0) {
                badges.push(`<span class="performance-badge tk">Tiefkuehlung -25: ${formatCapacity(item.capacityTK)}</span>`);
            }
            return badges.length ? `<div class="performance-badges">${badges.join('')}</div>` : '';
        }

        function jumpToCategory(category) {
            const row = document.getElementById(`category-${category}`);
            if (!row) return;
            row.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function loadInventory() {
            setConnectionState('Lade Lagerdaten...', false);
            try {
                const response = await fetch(INVENTORY_API_URL);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data && data.error ? data.error : 'Lagerdaten konnten nicht geladen werden.');
                }
                localData = data.products || {};
                renderTable();
                updateStats();
                document.getElementById('lastSync').innerText = 'Sync: ' + new Date().toLocaleTimeString();
                setConnectionState('Online & Synchron', true);
            } catch (error) {
                localData = {};
                renderTable();
                updateStats();
                setConnectionState(`Fehler beim Laden: ${error.message}`, false);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const keys = Object.keys(localData).sort((a, b) => String(localData[a].name || '').localeCompare(String(localData[b].name || '')));

            if (!keys.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:#94a3b8;">Keine Artikel vorhanden.</td></tr>';
                return;
            }

            let visibleCount = 0;
            const categories = ['condensing_unit', 'cp_box', 'evaporator', 'compressor', 'accessory'];

            categories.forEach((category) => {
                const rows = keys.filter((key) => {
                    const item = localData[key];
                    if (!item || !item.name) return false;
                    if ((item.category || 'accessory') !== category) return false;
                    const idText = String(item.id || '').toLowerCase();
                    const nameText = String(item.name || '').toLowerCase();
                    return !search || idText.includes(search) || nameText.includes(search);
                });

                if (!rows.length) return;
                visibleCount += rows.length;

                const sectionRow = document.createElement('tr');
                sectionRow.className = 'category-row';
                sectionRow.id = `category-${category}`;
                sectionRow.innerHTML = `<td colspan="5">${categoryLabel(category)} (${rows.length})</td>`;
                tbody.appendChild(sectionRow);

                rows.forEach((key) => {
                    const item = localData[key];
                    let statusBadge = item.qty > 0 ? '<span class="status-badge st-ok">Lagernd</span>' : '<span class="status-badge st-low">Leer</span>';
                    if (item.qty > 0 && item.qty <= 2) {
                        statusBadge = '<span class="status-badge" style="background:#ffedd5; color:#9a3412;">Wenig</span>';
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-family:monospace; color:#64748b;">${item.id || '-'}</td>
                        <td style="font-weight:600;">${item.name}${renderPerformanceBadges(item, category)}</td>
                        <td>
                            <div class="stock-ctrl">
                                <button class="btn-qty" onclick="updateStock('${key}', -1)">-</button>
                                <div class="val-qty">${item.qty || 0}</div>
                                <button class="btn-qty" onclick="updateStock('${key}', 1)">+</button>
                            </div>
                        </td>
                        <td>${statusBadge}</td>
                        <td class="action-col">
                            <button class="btn" style="background:#64748b; padding: 5px 10px;" onclick="openModal('${key}')">Bearbeiten</button>
                            <button class="btn" style="background:#dc2626; padding: 5px 10px;" onclick="deleteProduct('${key}')">Loeschen</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });

            if (!visibleCount) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">Keine Treffer fuer "${search}"</td></tr>`;
            }
        }

        function updateStats() {
            const keys = Object.keys(localData);
            document.getElementById('countTotal').innerText = keys.length;
            const low = keys.filter((k) => (localData[k].qty || 0) <= 0).length;
            document.getElementById('countLow').innerText = low;
        }

        async function syncFromOneDrive() {
            setSyncButtonState(true, 'Synchronisiert...');
            try {
                const response = await fetch(SYNC_FUNCTION_URL, { method: 'POST' });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data && data.error ? data.error : 'Synchronisierung fehlgeschlagen.');
                }
                document.getElementById('lastSync').innerText = `Sync: ${new Date().toLocaleTimeString()} | ${data.total} Artikel`;
                await loadInventory();
                alert(`OneDrive-Sync abgeschlossen.\nGesamt: ${data.total}\nNeu: ${data.created}\nAktualisiert: ${data.updated}`);
            } catch (error) {
                alert(`OneDrive-Sync fehlgeschlagen: ${error.message}`);
            } finally {
                setSyncButtonState(false);
            }
        }

        async function inventoryPost(payload) {
            const response = await fetch(INVENTORY_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data && data.error ? data.error : 'Anfrage fehlgeschlagen.');
            }
            return data;
        }

        async function updateStock(key, delta) {
            try {
                const data = await inventoryPost({ action: 'update_qty', key, delta });
                if (localData[key]) localData[key].qty = data.qty;
                renderTable();
                updateStats();
            } catch (error) {
                alert(`Fehler: ${error.message}`);
            }
        }

        function openModal(key = null) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalTitle').innerText = key ? 'Artikel bearbeiten' : 'Neuer Artikel';
            document.getElementById('modalKey').value = key || '';

            const item = key ? localData[key] : {};
            document.getElementById('modalId').value = item.id || '';
            document.getElementById('modalName').value = item.name || '';
            document.getElementById('modalPrice').value = item.price || 0;
            document.getElementById('modalQty').value = item.qty || 0;
            document.getElementById('modalCat').value = item.category || 'compressor';
            document.getElementById('modalNK').value = item.capacityNK || 0;
            document.getElementById('modalTK').value = item.capacityTK || 0;

            document.getElementById('modalId').readOnly = !!key;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        async function saveProduct() {
            const key = document.getElementById('modalKey').value;
            const id = document.getElementById('modalId').value.trim();
            if (!id) return alert('Art.Nr. ist ein Pflichtfeld!');

            const safeId = id.replace(/[.#$/\[\]]/g, '_');
            const productData = {
                id,
                name: document.getElementById('modalName').value.trim(),
                price: parseFloat(document.getElementById('modalPrice').value) || 0,
                qty: parseInt(document.getElementById('modalQty').value) || 0,
                category: document.getElementById('modalCat').value,
                capacityNK: parseInt(document.getElementById('modalNK').value) || 0,
                capacityTK: parseInt(document.getElementById('modalTK').value) || 0
            };

            try {
                await inventoryPost({ action: 'upsert', key: key || safeId, product: productData });
                closeModal();
                await loadInventory();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        async function deleteProduct(key) {
            if (!confirm(`Soll der Artikel "${localData[key].name}" wirklich geloescht werden?`)) return;
            try {
                await inventoryPost({ action: 'delete', key });
                await loadInventory();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        function handleCSV(input) {
            const file = input.files[0];
            if (!file) return;

            if (!confirm('CSV-Abgleich:\nBestehende Artikel werden aktualisiert, neue hinzugefuegt. Fortfahren?')) {
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                const items = [];
                let count = 0;

                lines.forEach((line, idx) => {
                    if (idx === 0 || !line.trim()) return;
                    const sep = line.includes(';') ? ';' : ',';
                    const cols = line.split(sep).map(c => c.trim());
                    if (cols.length < 4) return;

                    const id = cols[0];
                    if (!id) return;

                    const safeId = id.replace(/[.#$/\[\]]/g, '_');
                    const existing = localData[safeId] || {};
                    items.push({
                        key: safeId,
                        id,
                        name: cols[1] || existing.name || '',
                        price: parseFloat(cols[2]) || existing.price || 0,
                        qty: parseInt(cols[3]) || 0,
                        category: existing.category || 'accessory',
                        capacityNK: existing.capacityNK || 0,
                        capacityTK: existing.capacityTK || 0
                    });
                    count++;
                });

                inventoryPost({ action: 'batch_upsert', items })
                    .then(async () => {
                        await loadInventory();
                        alert(`${count} Artikel abgeglichen!`);
                    })
                    .catch((error) => alert('Fehler: ' + error.message))
                    .finally(() => {
                        input.value = '';
                    });
            };
            reader.readAsText(file, 'ISO-8859-1');
        }

        loadInventory();
</script>
